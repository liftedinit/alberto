name: CI
permissions:
  contents: read

on:
  # PR branches are covered by the pull_request run. A push run there would add a second
  # check with the same name to the PR.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache, so a cache entry can never stand in for the lockfile install.
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Run tests and generate coverage
        run: npm run test:run -- --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    uses: ./.github/workflows/_build.yml
    with:
      release_id: ${{ format('{0}', github.event.pull_request.number || github.ref_name) }}
