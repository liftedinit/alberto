name: Release
permissions:
  contents: read

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Check tag format
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        # The tag filter above is a glob, so the exact shape is enforced here:
        # X.Y.Z is a release, X.Y.Z-suffix is a pre-release, both with an optional leading v.
        run: |
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag '$TAG' is not a release or pre-release version"
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: validate
    uses: ./.github/workflows/_build.yml
    with:
      release_id: ${{ github.ref_name }}

  publish:
    name: Publish GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    # The only job with write access. It runs no project or dependency code:
    # it downloads the built artifacts and attaches them to the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: alberto_*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          ls -l artifacts
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "" "${flags[@]}" artifacts/*
